name: Najwa native app candidates

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: najwa-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Windows x64, os: windows-2025}
          - {name: Linux x64, os: ubuntu-22.04}
          - {name: macOS Apple Silicon, os: macos-15}
          - {name: macOS Intel, os: macos-15-intel}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libtss2-dev gnome-keyring dbus-x11
      - name: Windows assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm -y --no-progress
      - name: Build browser UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run web:build
      - name: Cache native dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('Cargo.lock') }}-
      - name: Build native Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\NASM;$env:PATH"
          ./scripts/native-cargo.ps1 -CargoArguments @('build','--manifest-path','Cargo.toml','--locked','-p','najwa-web','--features','bundled-ui','--release')
      - name: Build native Unix app
        if: runner.os != 'Windows'
        run: cargo +stable build --manifest-path Cargo.toml --locked -p najwa-web --features bundled-ui --release
      - name: Check native asset checksum ordering
        run: python scripts/test_package_local_web.py
      - name: Package native app
        run: python scripts/package-local-web.py --skip-build > target/native-package.json
      # Hosted runners are build-only candidates. Physical TPM / Secure Enclave
      # validation is a separate release gate; record approved software testing separately from physical hardware validation.
      - name: Windows profile guards (physical TPM validation is separate)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $preview = Get-Content -Raw target/native-package.json | ConvertFrom-Json
          $env:NAJWA_WEB_TEST_EXE = Join-Path $preview.directory 'Najwa.exe'
          $env:NAJWA_WEB_TEST_UI = (Resolve-Path target/local-web-ui).Path
          ./scripts/native-cargo.ps1 -CargoArguments @('test','--manifest-path','Cargo.toml','--locked','-p','najwa-web','--features','bundled-ui','--release','--test','profile_guards')
      - name: Linux guards and missing-TPM refusal
        if: runner.os == 'Linux'
        run: |
          export NAJWA_WEB_TEST_EXE="$(python -c 'import json; print(json.load(open("target/native-package.json"))["directory"] + "/Najwa")')"
          dbus-run-session -- bash -e -c '
            printf %s synthetic-ci-keyring | gnome-keyring-daemon --unlock --components=secrets
            cargo +stable test --manifest-path Cargo.toml --locked -p najwa-web --features bundled-ui --release --test profile_guards
            cargo +stable test --manifest-path Cargo.toml --locked -p najwa-web --features bundled-ui --release --test persistent_profile missing_tpm_ -- --ignored --test-threads=1
          '
      - name: macOS profile guards (physical Secure Enclave validation is separate)
        if: runner.os == 'macOS'
        run: |
          export NAJWA_WEB_TEST_EXE="$(python -c 'import json; print(json.load(open("target/native-package.json"))["directory"] + "/Najwa.app/Contents/MacOS/Najwa")')"
          cargo +stable test --manifest-path Cargo.toml --locked -p najwa-web --features bundled-ui --release --test profile_guards
      - name: Upload candidate and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: najwa-${{ matrix.os }}
          path: |
            target/packages/*.zip
            target/packages/*.tar.gz
            target/packages/*.sha256
          if-no-files-found: error
          retention-days: 14

  # On a version tag, collect every package once all four built and passed their
  # checks, and open a draft pre-release. A maintainer reviews and publishes it.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match workspace version $version"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          sed -e "s/{VERSION}/${GITHUB_REF_NAME#v}/g" -e "s/{TAG}/$GITHUB_REF_NAME/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --prerelease --verify-tag \
            --title "Najwa ${GITHUB_REF_NAME#v} (beta)" --notes-file notes.md
